/* Quire — styles. Plain CSS, no build step, no external fonts (works offline). */

:root {
  --bg: #f7f5f0;
  --surface: #fdfcf9;
  --side: #f0ede6;
  --ink: #2b2824;
  --ink-2: #5c574f;
  --muted: #968f84;
  --line: #e4dfd5;
  --line-2: #d5cfc3;
  --accent: #a8603a;
  --accent-ink: #fff;
  --accent-soft: rgba(168, 96, 58, .12);
  --sel: rgba(43, 40, 36, .075);
  --hover: rgba(43, 40, 36, .045);
  --shadow: 0 1px 2px rgba(40, 30, 20, .06), 0 10px 30px rgba(40, 30, 20, .10);
  --danger: #b4483c;
  --ok: #5f8a55;

  --st-idea: #9a8ec6;
  --st-draft: #c9a24a;
  --st-revised: #5d93a8;
  --st-final: #6f9a5a;

  --ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, Menlo, monospace;

  --prose-font: var(--serif);
  --prose-size: 19px;
  --measure: 34em;
  --side-w: 264px;
  --insp-w: 300px;
  color-scheme: light;
}

:root[data-theme="sepia"] {
  --bg: #f3ead9;
  --surface: #f8f1e4;
  --side: #ebe0ca;
  --ink: #3a2f22;
  --ink-2: #64553f;
  --muted: #9b8b71;
  --line: #e0d3bb;
  --line-2: #d2c2a3;
  --accent: #9b582c;
  --accent-soft: rgba(155, 88, 44, .13);
  --sel: rgba(58, 47, 34, .08);
  --hover: rgba(58, 47, 34, .05);
}

:root[data-theme="night"] {
  --bg: #1b1a18;
  --surface: #22201e;
  --side: #171614;
  --ink: #e8e3da;
  --ink-2: #bcb5a9;
  --muted: #80796e;
  --line: #2e2b28;
  --line-2: #3b3733;
  --accent: #d6915f;
  --accent-ink: #1b1a18;
  --accent-soft: rgba(214, 145, 95, .15);
  --sel: rgba(255, 250, 240, .085);
  --hover: rgba(255, 250, 240, .045);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 14px 36px rgba(0, 0, 0, .45);
  --danger: #e07a6c;
  --ok: #8fbf7f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 13.5px/1.45 var(--ui);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
::selection { background: var(--accent-soft); }
[hidden] { display: none !important; }

.ico { display: inline-flex; width: 16px; height: 16px; flex: none; }
.ico svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- layout ---------- */
#app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr) auto; height: 100vh; }
body.welcome-open #app { display: none; }
body.no-sidebar #app { grid-template-columns: 0 minmax(0, 1fr) auto; }
body.no-sidebar #sidebar { visibility: hidden; }

#sidebar { grid-column: 1; grid-row: 1; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
#main { grid-column: 2; grid-row: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
#view { flex: 1; overflow: auto; min-height: 0; position: relative; scroll-behavior: auto; }
#inspector { grid-column: 3; grid-row: 1; width: var(--insp-w); border-left: 1px solid var(--line); background: var(--surface); overflow: auto; display: none; }
body.show-inspector #inspector { display: block; }

/* ---------- sidebar ---------- */
.side-head { display: flex; align-items: center; gap: 8px; padding: 14px 14px 10px; }
.proj-title { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 4px 6px; margin: -4px -6px; border-radius: 6px; font: 600 14px/1.3 var(--serif); letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proj-title:hover { background: var(--hover); }

.modes { display: flex; flex-direction: column; gap: 1px; padding: 4px 8px 10px; border-bottom: 1px solid var(--line); }
.mode { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border: 0; background: none; border-radius: 6px; color: var(--ink-2); text-align: left; }
.mode:hover { background: var(--hover); color: var(--ink); }
.mode.active { background: var(--sel); color: var(--ink); font-weight: 550; }
.mode .ico { opacity: .8; }
.mode kbd { margin-left: auto; font: 10.5px var(--ui); color: var(--muted); opacity: 0; }
.mode:hover kbd { opacity: 1; }

.side-list { flex: 1; overflow: auto; padding: 8px 8px 16px; min-height: 0; }
.side-label { font: 600 10.5px/1 var(--ui); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 8px 8px 6px; }
.side-foot { display: flex; gap: 4px; padding: 8px; border-top: 1px solid var(--line); }
.side-foot .btn { flex: 1; justify-content: center; }

.b-item { display: flex; align-items: center; gap: 7px; padding: 4px 8px; border-radius: 6px; cursor: default; user-select: none; color: var(--ink-2); min-height: 27px; }
.b-item:hover { background: var(--hover); color: var(--ink); }
.b-item.sel { background: var(--sel); color: var(--ink); }
.b-label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.b-count { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.b-book { font-weight: 600; color: var(--ink); margin-bottom: 4px; }
.b-chap { font-weight: 550; color: var(--ink); }
.b-scenes { min-height: 4px; padding-bottom: 2px; }
.b-scene { padding-left: 30px; }
.twisty { border: 0; background: none; padding: 0; width: 16px; height: 16px; display: inline-flex; color: var(--muted); border-radius: 4px; }
.twisty .ico { width: 14px; height: 14px; transition: transform .15s; }
.twisty.closed .ico { transform: rotate(-90deg); }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--muted); }
.st-idea { background: var(--st-idea); }
.st-draft { background: var(--st-draft); }
.st-revised { background: var(--st-revised); }
.st-final { background: var(--st-final); }
.swatch { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.b-item.dragging, .card.dragging { opacity: .4; }
#dropline { position: fixed; height: 2px; background: var(--accent); border-radius: 2px; pointer-events: none; z-index: 50; display: none; box-shadow: 0 0 0 2px var(--accent-soft); }
.b-sub { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.b-ent { padding: 6px 8px; }
.b-ent .b-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }

/* ---------- buttons, fields ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); padding: 5px 10px; border-radius: 7px; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.ghost { border-color: transparent; background: none; color: var(--ink-2); }
.btn.ghost:hover { background: var(--hover); color: var(--ink); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.small { padding: 3px 8px; font-size: 12.5px; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border: 0; background: none; border-radius: 7px; color: var(--ink-2); }
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.icon-btn.on { color: var(--accent); }

.field { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 6px 9px; outline: none; transition: border-color .15s, background .15s; }
.field:hover { border-color: var(--line-2); }
.field:focus { border-color: var(--accent); background: var(--surface); }
textarea.field { resize: none; line-height: 1.5; display: block; overflow: hidden; }
select.field { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 28px; }
.plain { border: 0; background: none; outline: none; padding: 0; width: 100%; }

.seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 4px 10px; border-radius: 6px; color: var(--ink-2); font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .08), 0 0 0 1px var(--line); }

.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: none; padding: 3px 9px 3px 7px; border-radius: 99px; font-size: 12.5px; color: var(--ink-2); }
.chip:hover { border-color: var(--line-2); color: var(--ink); }
.chip.on { background: var(--sel); border-color: transparent; color: var(--ink); }
.chip.on .swatch { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px currentColor; }
.chip.suggest { border-style: dashed; }
.chip.add { color: var(--muted); }

.muted { color: var(--muted); }
.hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
kbd { font: 11px var(--ui); color: var(--muted); }

/* ---------- toolbar & statusbar ---------- */
#toolbar { height: 46px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 10px; transition: opacity .3s; }
.crumb { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; padding-left: 6px; white-space: nowrap; overflow: hidden; }
.crumb b { color: var(--ink-2); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.crumb .sep { opacity: .5; }

#statusbar { height: 30px; flex: none; display: flex; align-items: center; gap: 18px; padding: 0 16px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); transition: opacity .3s; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
#statusbar .grow { flex: 1; }
.meter { display: inline-block; width: 60px; height: 4px; border-radius: 4px; background: var(--line); vertical-align: middle; margin-left: 6px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.save-state { border: 0; background: none; padding: 2px 6px; border-radius: 5px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.save-state:hover { background: var(--hover); color: var(--ink); }
.save-state::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.save-state.ok::before { background: var(--ok); }
.save-state.warn { color: var(--accent); }
.save-state.warn::before { background: var(--accent); }
.save-state.err { color: var(--danger); }
.save-state.err::before { background: var(--danger); }

/* ---------- writing ---------- */
.page { font-size: var(--prose-size); max-width: calc(var(--measure) + 64px); margin: 0 auto; padding: 8vh 32px 45vh; }
.eyebrow { font: 600 10.5px/1 var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; }
.doc-title { display: block; font: 400 1.75em/1.2 var(--prose-font); letter-spacing: -.005em; margin: 0 0 1.1em; color: var(--ink); }
.doc-title::placeholder { color: var(--line-2); }
.book-title { font-size: 2.3em; text-align: center; margin-top: 6vh; margin-bottom: .2em; }
.book-author { font: italic 1em var(--prose-font); text-align: center; color: var(--muted); margin-bottom: 3.5em; }
.chap-head { display: block; width: 100%; text-align: center; border: 0; background: none; font: 400 1.35em/1.3 var(--prose-font); color: var(--ink); margin: 3.2em 0 1.6em; padding: 6px; border-radius: 6px; }
.chap-head:hover { background: var(--hover); }

.prose { font-family: var(--prose-font); font-size: 1em; line-height: 1.72; outline: none; caret-color: var(--accent); min-height: 1.72em; word-wrap: break-word; }
.prose p { margin: 0 0 .85em; }
body.para-indent .prose p { margin: 0; text-indent: 1.5em; }
body.para-indent .prose p:first-child { text-indent: 0; }
.prose.is-empty::before { content: attr(data-placeholder); color: var(--muted); opacity: .7; position: absolute; pointer-events: none; font-style: italic; }
.prose-wrap { position: relative; }
body.focus-mode.dim .prose:focus-within p { transition: opacity .35s; opacity: .3; }
body.focus-mode.dim .prose:focus-within p.current { opacity: 1; }

.scene-sep { display: flex; align-items: center; gap: 14px; margin: 2.4em 0 1.4em; color: var(--muted); font: 500 11.5px/1 var(--ui); letter-spacing: .04em; }
.scene-sep::before, .scene-sep::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.scene-sep button { border: 0; background: none; color: var(--muted); padding: 4px 8px; border-radius: 5px; max-width: 70%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scene-sep button:hover { background: var(--hover); color: var(--ink); }
.scene-sep:first-child { margin-top: 0; }
.add-under { display: flex; justify-content: center; margin-top: 3em; gap: 8px; opacity: .55; transition: opacity .2s; }
.add-under:hover { opacity: 1; }
body.focus-mode .add-under { display: none; }

/* focus mode */
body.focus-mode #sidebar, body.focus-mode #inspector { display: none !important; }
body.focus-mode #app { grid-template-columns: 0 minmax(0, 1fr) 0; }
body.focus-mode #toolbar, body.focus-mode #statusbar { opacity: 0; }
body.focus-mode #toolbar:hover, body.focus-mode #statusbar:hover { opacity: 1; }
body.focus-mode #statusbar { border-color: transparent; }
body.focus-mode .page { padding-top: 22vh; }

/* empty states */
.empty { max-width: 420px; margin: 18vh auto 0; text-align: center; color: var(--ink-2); padding: 0 24px; }
.empty h2 { font: 400 24px/1.3 var(--serif); color: var(--ink); margin: 0 0 8px; }
.empty p { margin: 0 0 20px; color: var(--muted); line-height: 1.6; }

/* ---------- inspector ---------- */
.insp { padding: 18px 18px 40px; display: flex; flex-direction: column; gap: 18px; }
.insp-sec > label, .sec-label { display: block; font: 600 10.5px/1 var(--ui); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.insp .seg { display: flex; flex-wrap: nowrap; }
.insp .seg button { flex: 1; justify-content: center; padding: 4px 4px; gap: 5px; }
.insp-foot { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 14px; }
.stat-row { display: flex; gap: 16px; }
.stat { flex: 1; }
.stat b { display: block; font: 400 22px/1.2 var(--serif); color: var(--ink); font-variant-numeric: tabular-nums; }
.stat span { font-size: 11.5px; color: var(--muted); }
.spark { display: flex; align-items: flex-end; gap: 3px; height: 54px; padding-top: 4px; }
.spark i { flex: 1; background: var(--accent); opacity: .75; border-radius: 2px 2px 0 0; min-height: 2px; }
.spark i.zero { background: var(--line-2); opacity: 1; }
.spark-legend { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; }

/* ---------- board ---------- */
.board { display: flex; gap: 16px; padding: 20px 24px 40px; align-items: flex-start; min-height: 100%; width: max-content; }
.col { width: 260px; flex: none; background: var(--side); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.col-head { display: flex; align-items: center; gap: 8px; padding: 2px 4px 4px; }
.col-title { font: 600 14px/1.3 var(--serif); }
.col-head .b-count { white-space: nowrap; }
.cards { display: flex; flex-direction: column; gap: 8px; min-height: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--line-2); border-radius: 8px; padding: 10px 12px; cursor: pointer; box-shadow: 0 1px 1px rgba(0, 0, 0, .03); transition: box-shadow .15s, transform .15s; }
.card:hover { box-shadow: var(--shadow); }
.card-title { font: 600 13.5px/1.35 var(--ui); margin-bottom: 4px; }
.card-syn { font: 13px/1.5 var(--serif); color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.card-syn.excerpt { font-style: italic; color: var(--muted); }
.card-foot { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 11.5px; color: var(--muted); }
.card-foot .grow { flex: 1; }
.card-who { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { display: inline-flex; align-items: center; gap: 5px; }
.add-card { border: 1px dashed var(--line-2); background: none; border-radius: 8px; padding: 6px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; }
.add-card:hover { color: var(--ink); border-color: var(--muted); }
.add-col { width: 200px; flex: none; height: 46px; }

/* ---------- plot grid ---------- */
.plot-wrap { padding: 20px 24px 60px; }
.plot-intro { color: var(--muted); max-width: 640px; margin: 0 0 16px; line-height: 1.55; }
.grid-scroll { overflow: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); max-width: 100%; width: fit-content; }
table.grid { border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
.grid th, .grid td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0; }
.grid thead th { background: var(--side); font-weight: 500; position: sticky; top: 0; z-index: 2; }
.grid thead tr:nth-child(2) th { top: 31px; }
.grid .corner { position: sticky; left: 0; z-index: 3; text-align: left; padding: 8px 12px; font: 600 10.5px/1 var(--ui); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); min-width: 190px; }
.grid .ch-th { padding: 8px 10px; text-align: left; font: 600 12.5px var(--serif); white-space: nowrap; height: 31px; }
.grid .sc-th { height: 130px; vertical-align: bottom; width: 34px; min-width: 34px; }
.grid .sc-th button { writing-mode: vertical-rl; text-orientation: sideways; transform: rotate(180deg); border: 0; background: none; padding: 8px 0; width: 100%; max-height: 126px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); text-align: left; }
.grid .sc-th button:hover { color: var(--accent); }
.grid .rowhead { position: sticky; left: 0; background: var(--surface); z-index: 1; text-align: left; padding: 6px 12px; font-weight: 500; white-space: nowrap; }
.grid .rowhead > div { display: flex; align-items: center; gap: 8px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.grid .section td, .grid .section th { background: var(--bg); padding: 10px 12px 6px; font: 600 10.5px/1 var(--ui); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: left; position: sticky; left: 0; }
.grid td.cell { width: 34px; height: 32px; text-align: center; cursor: pointer; }
.grid td.cell:hover { background: var(--hover); }
.cell i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: middle; }
.cell i.ring { background: transparent !important; box-shadow: inset 0 0 0 2px currentColor; }
.cell i.pov { width: 14px; height: 14px; box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px currentColor; }
.grid .add-row td { padding: 6px 10px; }
.legend { display: flex; gap: 18px; margin: 12px 2px 0; color: var(--muted); font-size: 12px; align-items: center; flex-wrap: wrap; }
.legend .cell i { margin-right: 6px; color: var(--muted); background: var(--muted); }
.threads { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-top: 28px; }
.thread-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.thread-card .row { display: flex; align-items: center; gap: 8px; }

<script>
/* Quire three-way merge.
 *
 * Given the version two copies last agreed on (base), this computer's copy (local) and the
 * other copy (remote: the cloud, or the file as changed on disk by another computer), produce
 * one story that keeps both sides' work.
 *
 * Every chapter, scene, character, place, thread and note has a stable id, so the merge works
 * per item and per field:
 *   - a field changed on one side only takes that side's value;
 *   - tag lists (characters and threads on a scene) merge as sets: additions and removals from both;
 *   - an item deleted on one side and untouched on the other is deleted; edited on the other, it stays;
 *   - order follows whichever side rearranged; new items land next to their old neighbours;
 *   - if both sides rewrote the same scene's prose, BOTH versions are kept, the other one as a new
 *     scene placed right after it and marked "(other version)". Nothing is ever silently dropped.
 *   - both sides edited the same notes/synopsis/summary: both texts are kept, one after the other.
 *
 * Pure functions, no DOM: loaded as a classic script in the app, and by Node for tests.
 */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.QuireMerge = api;
})(typeof self !== 'undefined' ? self : this, () => {
  'use strict';

  function stable(v) {
    if (Array.isArray(v)) return `[${v.map(stable).join(',')}]`;
    if (v && typeof v === 'object') {
      return `{${Object.keys(v).filter((k) => v[k] !== undefined).sort().map((k) => `${JSON.stringify(k)}:${stable(v[k])}`).join(',')}}`;
    }
    return JSON.stringify(v === undefined ? null : v);
  }
  const same = (a, b) => stable(a) === stable(b);
  const clone = (v) => (v === undefined ? undefined : JSON.parse(JSON.stringify(v)));
  const newId = (p) => p + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);

  const ID_SETS = new Set(['characters', 'threads']);
  const LONG_TEXT = new Set(['synopsis', 'notes', 'summary']);
  const OTHER = '\n\n--- other version (kept by sync) ---\n';

  /** Set-merge two edited copies of an id list. Keeps local order, appends remote additions. */
  function mergeIdSet(b, l, r) {
    const B = new Set(b || []), L = new Set(l || []), R = new Set(r || []);
    const out = [];
    for (const x of l || []) if (!(B.has(x) && !R.has(x)) && !out.includes(x)) out.push(x);
    for (const x of r || []) if (!L.has(x) && !B.has(x) && !out.includes(x)) out.push(x);
    return out;
  }

  /** Resolve a field both sides changed differently. */
  function resolve(k, lv, rv, ctx, item, kind) {
    if (k === 'modified' || k === 'created') return (k === 'modified' ? lv > rv : lv < rv) ? lv : rv;
    if (kind === 'scene' && k === 'content') {
      ctx.contentConflicts.push({ id: item.id, remote: rv });
      return lv;
    }
    if (kind === 'note' && k === 'content') {
      ctx.conflicts.push({ kind, id: item.id, field: k, title: item.title });
      return `${lv}<p>— other version (kept by sync) —</p>${rv}`;
    }
    if (LONG_TEXT.has(k) && typeof lv === 'string' && typeof rv === 'string') {
      if (rv.includes(lv)) return rv;
      if (lv.includes(rv)) return lv;
      ctx.conflicts.push({ kind, id: item.id, field: k, title: item.title || item.name });
      return lv + OTHER + rv;
    }
    ctx.conflicts.push({ kind, id: item.id, field: k, title: item.title || item.name, kept: 'local' });
    return clone(lv);
  }

  function mergeFields(b, l, r, ctx, kind, skip) {
    const out = {};
    const keys = new Set([...Object.keys(l), ...Object.keys(r)]);
    for (const k of keys) {
      if (skip && skip.has(k)) continue;
      const lv = l[k], rv = r[k], bv = b ? b[k] : undefined;
      if (!(k in r)) { out[k] = clone(lv); continue; }
      if (!(k in l)) { out[k] = clone(rv); continue; }
      if (kind === 'scene' && ID_SETS.has(k) && Array.isArray(lv) && Array.isArray(rv)) { out[k] = mergeIdSet(bv, lv, rv); continue; }
      if (same(lv, rv)) out[k] = clone(lv);
      else if (b && same(bv, lv)) out[k] = clone(rv);
      else if (b && same(bv, rv)) out[k] = clone(lv);
      else out[k] = resolve(k, lv, rv, ctx, l, kind);
    }
    return out;
  }

  const byId = (arr) => { const m = new Map(); for (const x of arr || []) if (x && x.id != null) m.set(x.id, x); return m; };
  const ids = (arr) => (arr || []).map((x) => x.id);

  /** Merge an ordering. Follows whichever side rearranged the items they share; slots in new items. */
  function mergeOrder(b, l, r, keep) {
    b = b || []; l = l || []; r = r || [];
    const inAll = new Set(b.filter((x) => l.includes(x) && r.includes(x)));
    const proj = (seq) => seq.filter((x) => inAll.has(x));
    const lMoved = !same(proj(b), proj(l)), rMoved = !same(proj(b), proj(r));
    const primary = rMoved && !lMoved ? r : l;
    const secondary = primary === l ? r : l;
    const out = primary.filter((x) => keep.has(x));
    const placed = new Set(out);
    let prev = null;
    for (const x of secondary) {
      if (!keep.has(x)) continue;
      if (!placed.has(x)) { out.splice(prev == null ? 0 : out.indexOf(prev) + 1, 0, x); placed.add(x); }
      prev = x;
    }
    for (const x of keep) if (!placed.has(x)) { out.push(x); placed.add(x); }
    return out;
  }

  /** Merge a list of items with ids. Returns a Map id -> merged item (unordered). */
  function mergeItems(bArr, lArr, rArr, ctx, kind, compareSkip) {
    const B = byId(bArr), L = byId(lArr), R = byId(rArr);
    const strip = (x) => { if (!compareSkip) return x; const c = { ...x }; for (const k of compareSkip) delete c[k]; return c; };
    const out = new Map();
    for (const id of new Set([...L.keys(), ...R.keys()])) {
      const b = ctx.hasBase ? B.get(id) : undefined, l = L.get(id), r = R.get(id);
      if (l && r) out.set(id, mergeFields(b, l, r, ctx, kind, compareSkip ? new Set(compareSkip) : null));
      else {
        const only = l || r;
        if (b && same(strip(b), strip(only))) continue; // deleted on the other side, untouched here
        if (b) ctx.conflicts.push({ kind, id, field: 'deleted', title: only.title || only.name, kept: 'edited copy' });
        const c = clone(only);
        if (compareSkip) for (const k of compareSkip) delete c[k];
        out.set(id, c);
      }
    }
    return out;
  }

  function flatScenes(p) {
    const out = [];
    for (const c of (p && p.manuscript) || []) for (const s of c.children || []) out.push({ ...s, _parent: c.id });
    return out;
  }
  const childIds = (p, cid) => { const c = ((p && p.manuscript) || []).find((x) => x.id === cid); return c ? ids(c.children) : []; };

  /**
   * merge(base, local, remote) -> { project, conflicts, copies }
   * base may be null when the two copies have no known common ancestor.
   */
  function merge(base, local, remote) {
    if (same(local, remote)) return { project: clone(local), conflicts: [], copies: 0 };
    const ctx = { hasBase: !!base, conflicts: [], contentConflicts: [] };
    const b = base || {};
    const skipTop = new Set(['manuscript', 'characters', 'locations', 'threads', 'notes', 'meta', 'stats']);
    const out = mergeFields(base ? b : null, local, remote, ctx, 'story', skipTop);

    out.meta = mergeFields(base ? b.meta || {} : null, local.meta || {}, remote.meta || {}, ctx, 'meta');

    // Daily word stats: union of days; for a shared day keep the widest span.
    const daily = {};
    const ld = (local.stats && local.stats.daily) || {}, rd = (remote.stats && remote.stats.daily) || {};
    for (const day of new Set([...Object.keys(ld), ...Object.keys(rd)])) {
      const x = ld[day], y = rd[day];
      daily[day] = x && y ? { start: Math.min(x.start, y.start), end: Math.max(x.end, y.end) } : clone(x || y);
    }
    out.stats = { ...clone(remote.stats || {}), ...clone(local.stats || {}), daily };

    for (const [key, kind] of [['characters', 'character'], ['locations', 'location'], ['threads', 'thread'], ['notes', 'note']]) {
      const merged = mergeItems(b[key], local[key], remote[key], ctx, kind);
      out[key] = mergeOrder(ids(b[key]), ids(local[key]), ids(remote[key]), new Set(merged.keys())).map((id) => merged.get(id));
    }

    // Scenes as one flat list with a parent field, so moving a scene between chapters merges too.
    const scenes = mergeItems(flatScenes(base), flatScenes(local), flatScenes(remote), ctx, 'scene');
    const chapterSkip = ['children'];
    const chapters = mergeItems(b.manuscript, local.manuscript, remote.manuscript, ctx, 'chapter', chapterSkip);
    // A chapter deleted on one side but given new or edited scenes on the other comes back.
    for (const s of scenes.values()) {
      if (chapters.has(s._parent)) continue;
      const src = [local, remote, b].map((p) => ((p && p.manuscript) || []).find((c) => c.id === s._parent)).find(Boolean);
      if (src) { const c = clone(src); delete c.children; chapters.set(c.id, c); } else s._parent = null;
    }
    const chapterOrder = mergeOrder(ids(b.manuscript), ids(local.manuscript), ids(remote.manuscript), new Set(chapters.keys()));
    // Scenes whose chapter vanished entirely go to the last chapter (or a new one).
    const orphans = [...scenes.values()].filter((s) => !s._parent);
    if (orphans.length) {
      let last = chapterOrder[chapterOrder.length - 1];
      if (!last) { last = newId('c'); chapters.set(last, { id: last, title: 'Recovered scenes', synopsis: '', notes: '' }); chapterOrder.push(last); }
      for (const s of orphans) s._parent = last;
    }

    // Both sides rewrote a scene: keep theirs as a new scene right after ours.
    const copyAfter = new Map();
    for (const { id, remote: rv } of ctx.contentConflicts) {
      const s = scenes.get(id);
      const copy = {
        ...clone(s), id: newId('s'), title: `${s.title || 'Untitled scene'} (other version)`, content: rv,
        notes: `Sync kept both versions: this scene was changed on two computers before they could sync. Keep the one you want (or combine them) and delete the other.${s.notes ? `\n\n${s.notes}` : ''}`,
      };
      scenes.set(copy.id, copy);

    }

    out.manuscript = chapterOrder.map((cid) => {
      const keep = new Set([...scenes.values()].filter((s) => s._parent === cid && ![...copyAfter.values()].includes(s.id)).map((s) => s.id));
      const order = mergeOrder(childIds(base, cid), childIds(local, cid), childIds(remote, cid), keep);
      const withCopies = order.flatMap((id) => (copyAfter.has(id) ? [id, copyAfter.get(id)] : [id]));
      const ch = chapters.get(cid);
      return { ...ch, children: withCopies.map((id) => { const s = { ...scenes.get(id) }; delete s._parent; return s; }) };
    });

    return { project: out, conflicts: ctx.conflicts, copies: copyAfter.size };
  }

  /** True when two serialised stories hold the same work (ignores save-time bookkeeping). */
  function sameDoc(a, b) {
    const norm = (x) => {
      const p = typeof x === 'string' ? JSON.parse(x) : clone(x);
      delete p.app;
      if (p.meta) delete p.meta.modified;
      return stable(p);
    };
    return norm(a) === norm(b);
  }

  return { merge, mergeOrder, mergeIdSet, sameDoc, stable };
});

 *
 * A .docx is a zip of XML files. This file carries a small zip writer (stored, no compression)

      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
      lh.setUint16(10, time, true); lh.setUint16(12, date, true); lh.setUint32(14, crc, true);
      lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);

    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);

<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>
${style('Body', 'Body Text', '<w:ind w:firstLine="720"/>')}
${style('FirstPara', 'First Paragraph', '<w:ind w:firstLine="0"/>')}
${style('Contact', 'Contact', '<w:spacing w:line="240" w:lineRule="auto"/>')}
${style('Title', 'Title', '<w:spacing w:before="4320" w:after="240"/><w:jc w:val="center"/>', '<w:sz w:val="36"/><w:szCs w:val="36"/>')}
${style('Byline', 'Byline', '<w:jc w:val="center"/>')}
${style('Heading1', 'heading 1', '<w:keepNext/><w:pageBreakBefore/><w:spacing w:before="2880" w:after="480"/><w:jc w:val="center"/><w:outlineLvl w:val="0"/>', '<w:sz w:val="28"/><w:szCs w:val="28"/>', '<w:next w:val="FirstPara"/>')}
${style('SceneBreak', 'Scene Break', '<w:jc w:val="center"/>', '', '<w:next w:val="FirstPara"/>')}

    return zip([
      { name: '[Content_Types].xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>' },

      { name: 'word/_rels/document.xml.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>' },

      { name: 'docProps/core.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${escXML(m.title || '')}</dc:title><dc:creator>${escXML(m.author || '')}</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${now}</dcterms:created><dcterms:modified xsi:type="dcterms:W3CDTF">${now}</dcterms:modified></cp:coreProperties>` },
    ]);
  }

  return { zip, unzip, crc32, importText, importDocx, exportDocx };
});

    get: (k) => safe(op('readonly', (s) => s.get(k)), undefined),
    set: (k, v) => safe(op('readwrite', (s) => s.put(v, k)), undefined),
    del: (k) => safe(op('readwrite', (s) => s.delete(k)), undefined),
    keys: () => safe(op('readonly', (s) => s.getAllKeys()), []),

/* =========================================================================
 * Change tracking, saving, backups
 * ========================================================================= */
const scheduleSave = debounce(() => saveNow(), 1500);
const scheduleBackup = debounce(() => backupNow(), 4000);

function touch() {
  dirty = true;
  changeSeq++;
  project.meta.modified = nowISO();
  trackDaily();
  scheduleSave();
  if (!fileHandle) scheduleBackup();
  if (project.meta.cloud) scheduleSync();
  renderStatus();
}

async function backupNow(data = serialize()) {
  if (!project) return;
  const id = project.meta.id;
  const rec = { id, title: project.meta.title, modified: project.meta.modified, at: Date.now(), words: totalWC(), fileName, data };
  await idb.set(`backup:${id}`, rec);
  const snaps = (await idb.get(`snaps:${id}`)) || [];
  if (!snaps.length || Date.now() - snaps[0].at > 10 * 60 * 1000) {
    snaps.unshift({ at: rec.at, words: rec.words, data });
    await idb.set(`snaps:${id}`, snaps.slice(0, 30));
  }
}

async function saveNow({ interactive = false } = {}) {
  if (!project) return;
  flushEditors();
  const seq = changeSeq;
  const data = serialize();
  await backupNow(data);
  if (!fileHandle) {
    if (interactive) return saveAs();
    renderStatus();
    return;
  }
  if (saving) { saveAgain = true; return; }
  saving = true;
  renderStatus();
  try {
    let perm = fileHandle.queryPermission ? await fileHandle.queryPermission({ mode: 'readwrite' }) : 'granted';
    if (perm !== 'granted' && interactive) perm = await fileHandle.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') { needsPerm = true; return; }
    needsPerm = false;
    let out = data;
    if (await checkDisk()) out = serialize(); // merged someone else's changes in first
    const w = await fileHandle.createWritable();
    await w.write(out);
    await w.close();
    try { disk = { modified: (await fileHandle.getFile()).lastModified, data: out }; } catch { /* keep going */ }
    if (seq === changeSeq) dirty = false;
    lastSaved = Date.now();
    saveError = null;
  } catch (e) {
    saveError = e;
    console.error('Save failed', e);
  } finally {
    saving = false;
    renderStatus();
    if (saveAgain) { saveAgain = false; saveNow(); }
  }

/**
 * If the file on disk changed since Quire last read or wrote it (e.g. a sync client brought in an edit
 * made on another computer), merge that version into the open story. Returns true if it merged.
 */
let disk = { modified: 0, data: null };
async function checkDisk() {
  if (!fileHandle || !disk.modified || !project) return false;
  let f;
  try { f = await fileHandle.getFile(); } catch { return false; }
  if (f.lastModified === disk.modified) return false;
  const text = await f.text();
  const before = disk.data;
  disk = { modified: f.lastModified, data: text };
  if (text === before) return false;
  let other;
  try { other = JSON.parse(text); } catch { return false; } // half-written by a sync client; look again next time
  if (!other || !other.meta || other.meta.id !== project.meta.id) { toast('The story file was replaced with a different story on disk. Quire kept your version.'); return false; }
  if (QuireMerge.sameDoc(other, serialize())) return false;
  flushEditors();
  const m = QuireMerge.merge(before ? JSON.parse(before) : null, JSON.parse(serialize()), normalize(other));
  applyMerged(m, 'The file was changed on another computer');
  return true;
}

async function saveAs() {
  if (!project) return;
  flushEditors();
  if (!HAS_FS) { downloadProject(); return; }
  try {
    const handle = await window.showSaveFilePicker({ suggestedName: safeName(project.meta.title) + EXT, types: SAVE_TYPES });
    fileHandle = handle;
    fileName = handle.name;
    saveError = null;
    disk = { modified: 0, data: null };
    await saveNow({ interactive: true });
    await addRecent(handle);
    toast(`Saving to ${handle.name}`);
  } catch (e) {
    if (e.name !== 'AbortError') { toast(`Couldn’t save: ${e.message}`); console.error(e); }
  }

function download(name, content, type) {
  const url = URL.createObjectURL(content instanceof Blob ? content : new Blob([content], { type }));
  const a = h('a', { href: url, download: name });

}

  flushEditors();
  download(safeName(project.meta.title) + EXT, serialize(), 'application/json');
  dirty = false;

  if (!handle || !project) return;
  const list = await getRecent();
  const keep = [];
  for (const r of list) {
    let same = false;
    try { same = await r.handle.isSameEntry(handle); } catch { /* stale */ }
    if (!same) keep.push(r);
  }
  keep.unshift({ name: handle.name, title: project.meta.title, at: Date.now(), handle, id: project.meta.id });
  await idb.set('recent', keep.slice(0, 8));
}
async function removeRecent(entry) {
  const list = await getRecent();
  await idb.set('recent', list.filter((r) => r.at !== entry.at));
}

async function listBackups() {
  const keys = (await idb.keys()).filter((k) => String(k).startsWith('backup:'));
  const out = [];
  for (const k of keys) {
    const b = await idb.get(k);
    if (b) out.push(b);
  }
  return out.sort((a, b) => b.at - a.at);
}

  let p;
  try { p = normalize(typeof data === 'string' ? JSON.parse(data) : data); } catch (e) {
    toast(e instanceof SyntaxError ? 'That file isn’t valid Quire JSON.' : e.message);
    return false;
  }
  project = p;
  fileHandle = handle;
  fileName = handle ? handle.name : '';
  dirty = false; saveError = null; needsPerm = false; changeSeq = 0;
  disk = handle && modified ? { modified, data: typeof data === 'string' ? data : null } : { modified: 0, data: null };
  undoStack.length = 0; redoStack.length = 0;
  sync.state = project.meta.cloud ? 'idle' : 'off';
  const first = scenes()[0];
  ui.view = 'write';
  ui.sel = first ? { kind: 'scene', id: first.id } : { kind: 'book', id: null };
  ui.collapsed.clear();
  ui.entitySel = { characters: null, locations: null };
  ui.noteSel = project.notes[0]?.id || null;
  trackDaily();
  hideWelcome();
  renderAll();
  if (handle) addRecent(handle);
  idb.set('last', project.meta.id);
  if (project.meta.cloud) setTimeout(() => syncStory({ force: true }), 50);

  // If the browser holds newer work than the file (e.g. a crash before the last write), offer it.
  if (recoverCheck) {
    const b = await idb.get(`backup:${project.meta.id}`);
    if (b && b.modified > project.meta.modified) {
      const yes = await confirmBox(
        `This browser has a newer copy of “${b.title}” (saved ${ago(b.at)}, ${plural(b.words, 'word')}) than the file you opened. Use the newer copy?`,
        { ok: 'Use newer copy', cancel: 'Keep file version' });
      if (yes) {
        const keep = fileHandle;
        await openProject(b.data, keep, { recoverCheck: false });
        touch();
      }
    }
  }
  return true;
}

async function openFile() {
  if (HAS_FS) {
    try {
      const [handle] = await window.showOpenFilePicker({ types: OPEN_TYPES, multiple: false });
      const file = await handle.getFile();
      await openProject(await file.text(), handle, { modified: file.lastModified });
    } catch (e) {
      if (e.name !== 'AbortError') toast(`Couldn’t open: ${e.message}`);
    }
    return;
  }
  const input = h('input', { type: 'file', accept: '.quire,.json,application/json', style: { display: 'none' } });
  input.addEventListener('change', async () => {
    const f = input.files[0];
    input.remove();
    if (!f) return;
    if (await openProject(await f.text(), null)) fileName = f.name;
  });
  document.body.append(input);
  input.click();
}

async function openRecent(entry) {
  try {
    let perm = await entry.handle.queryPermission({ mode: 'readwrite' });
    if (perm !== 'granted') perm = await entry.handle.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') { toast('Quire needs permission to open that file.'); return; }
    const file = await entry.handle.getFile();
    await openProject(await file.text(), entry.handle, { modified: file.lastModified });
  } catch (e) {
    console.warn(e);
    toast('Couldn’t open that file. It may have been moved or renamed.');
    await removeRecent(entry);
    showWelcome();
  }
}

async function openHandle(handle) {
  try {
    if (handle.kind !== 'file') return;
    const file = await handle.getFile();
    await openProject(await file.text(), handle, { modified: file.lastModified });
  } catch (e) { toast(`Couldn’t open: ${e.message}`); }
}

async function closeProject() {
  if (!project) return;
  await saveNow();
  if (project.meta.cloud) await syncStory({ force: true });
  if (!fileHandle && dirty && !(await confirmBox('This story hasn’t been saved to a file. It stays in this browser’s backups, but a file is safer. Close anyway?', { ok: 'Close', cancel: 'Keep writing' }))) return;
  project = null; fileHandle = null; fileName = '';
  showWelcome();
}

function createNew(title) {
  openProject(newProject(title), null, { recoverCheck: false }).then(() => {
    if (HAS_FS) saveAs();
    setTimeout(() => focusTitle(), 50);
  });
}

/* ---------- binding helpers ---------- */
/** Text input bound to obj[key]; other inputs bound to the same value update live. */
function bound(obj, key, attrs = {}, after) {
  const tag = attrs.multiline ? 'textarea' : 'input';
  const a = { ...attrs };
  delete a.multiline;
  const bind = a['data-bind'] || `${obj.id}:${key}`;
  const el = h(tag, { ...a, value: obj[key] ?? '', 'data-bind': bind });
  el.addEventListener('input', () => {
    obj[key] = el.value;
    for (const o of $$(`[data-bind="${bind}"]`)) if (o !== el) o.value = el.value;
    touch();
    if (after) after(el.value);
  });
  if (tag === 'textarea') autosize(el);
  return el;
}
function autosize(ta) {
  const fit = () => { ta.style.height = 'auto'; ta.style.height = `${ta.scrollHeight + 2}px`; };
  ta.addEventListener('input', fit);
  requestAnimationFrame(fit);
  return ta;
}
function segmented(options, value, onPick) {
  const seg = h('div', { class: 'seg' });
  for (const [v, label, extra] of options) {
    seg.append(h('button', { class: v === value ? 'on' : '', type: 'button', onclick: () => {
      $$('button', seg).forEach((b) => b.classList.remove('on'));
      seg.children[options.findIndex((o) => o[0] === v)].classList.add('on');
      onPick(v);
    } }, extra || null, label));
  }
  return seg;
}
function selectBox(items, value, empty, onPick, newLabel) {
  const s = h('select', { class: 'field', onchange: () => onPick(s.value) },
    h('option', { value: '' }, empty),
    items.map((e) => h('option', { value: e.id, selected: e.id === value }, e.name || 'Unnamed')),
    newLabel ? h('option', { value: '__new' }, newLabel) : null);
  s.value = value || '';
  return s;
}
function sec(label, ...kids) { return h('div', { class: 'insp-sec' }, h('label', {}, label), ...kids); }
function avatar(e) {
  const initials = (e.name || '?').trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase() || '?';
  return h('span', { class: 'avatar', style: { background: e.color } }, initials);
}

/* ---------- the prose editor ---------- */
const editors = new Map();   // element -> object with .content (scene or note)
const pending = new Set();   // editors with unflushed changes
const commitSoon = debounce(() => flushEditors(), 500);

function editorFor(obj, placeholder = 'Begin writing…') {
  const el = h('div', { class: 'prose', contenteditable: 'true', spellcheck: 'true', 'data-id': obj.id, 'data-placeholder': placeholder, role: 'textbox', 'aria-multiline': 'true' });
  el.innerHTML = obj.content || '<p><br></p>';
  editors.set(el, obj);
  const markEmpty = () => el.classList.toggle('is-empty', !el.textContent.trim() && el.querySelectorAll('p').length <= 1);
  markEmpty();
  el.addEventListener('input', () => {
    lastInputAt = Date.now();
    if (el.firstChild && el.firstChild.nodeType === 3) document.execCommand('formatBlock', false, 'p');
    pending.add(el);
    markEmpty();
    commitSoon();
    if (!dirty) { dirty = true; renderStatus(); }
    requestAnimationFrame(typewriterScroll);
  });
  el.addEventListener('beforeinput', smartType);
  el.addEventListener('paste', onPaste);
  el.addEventListener('focus', () => {
    if (obj.id.startsWith('s')) { ui.activeSceneId = obj.id; renderStatus(); }
  });
  el.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') e.preventDefault();
    if (['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Enter'].includes(e.key)) requestAnimationFrame(typewriterScroll);
  });
  const wrap = h('div', { class: 'prose-wrap' }, el);
  return wrap;
}

function flushEditors() {
  if (!pending.size) return;
  commitSoon.cancel();
  let changed = false;
  for (const el of pending) {
    const obj = editors.get(el);
    if (!obj) continue;
    const html = sanitizeHTML(el.innerHTML);
    if (html !== obj.content) {
      obj.content = html;
      if (obj.id.startsWith('s')) obj._wc = countWords(plainOf(obj));
      changed = true;
    }
  }
  pending.clear();
  for (const el of [...editors.keys()]) if (!el.isConnected) editors.delete(el);
  if (changed) {
    touch();
    if (['write', 'board', 'plot'].includes(ui.view)) refreshCounts();
  }
}

/** Update word counts in the binder and inspector without re-rendering anything being typed in. */
function refreshCounts() {
  for (const el of $$('#sideList .b-scene')) {
    const s = locateScene(el.dataset.scene)?.scene;
    if (s) el.querySelector('.b-count').textContent = fmt(wcOf(s));
  }
  for (const el of $$('#sideList .b-chap')) {
    const ch = chapterOf(el.dataset.chapter);
    if (ch) el.querySelector('.b-count').textContent = fmt(chapterWC(ch));
  }
  const book = $('#sideList .b-book .b-count');
  if (book) book.textContent = fmt(totalWC());
  const iw = $('#inspector [data-live="wc"]');
  if (iw) {
    const s = ui.sel.kind === 'scene' && locateScene(ui.sel.id)?.scene;
    if (s) iw.textContent = plural(wcOf(s), 'word');
  }
}

function prevChars(n) {
  const sel = getSelection();
  if (!sel.rangeCount) return '';
  const r = sel.getRangeAt(0);
  if (!r.collapsed || r.startContainer.nodeType !== 3) return '';
  return r.startContainer.data.slice(Math.max(0, r.startOffset - n), r.startOffset);
}
function smartType(e) {
  if (!prefs.smart || e.inputType !== 'insertText' || !e.data || e.data.length !== 1) return;
  const d = e.data;
  if (d === '"' || d === "'") {
    const prev = prevChars(1);
    const opening = !prev || /[\s([{—–“‘]/.test(prev);
    const ch = d === '"' ? (opening ? '“' : '”') : (opening ? '‘' : '’');
    e.preventDefault();
    document.execCommand('insertText', false, ch);
  } else if (d === '-' && prevChars(1) === '-') {
    e.preventDefault();
    document.execCommand('delete');
    document.execCommand('insertText', false, '—');
  } else if (d === '.' && prevChars(2) === '..') {
    e.preventDefault();
    document.execCommand('delete'); document.execCommand('delete');
    document.execCommand('insertText', false, '…');
  }
}
function onPaste(e) {
  e.preventDefault();
  const html = e.clipboardData.getData('text/html');
  const text = e.clipboardData.getData('text/plain');
  if (html) {
    const clean = sanitizeHTML(html);
    const paras = paragraphsOf(clean);
    if (paras.length === 1) document.execCommand('insertHTML', false, paras[0].innerHTML);
    else document.execCommand('insertHTML', false, clean);
  } else if (text) {
    if (!/\n/.test(text)) document.execCommand('insertText', false, text);
    else document.execCommand('insertHTML', false, textToHTML(text));
  }
}

function typewriterScroll() {
  if (!prefs.typewriter || !document.body.classList.contains('focus-mode')) return;
  const sel = getSelection();
  if (!sel.rangeCount || !document.activeElement?.classList.contains('prose')) return;
  const r = sel.getRangeAt(0);
  let rect = r.getClientRects()[0];
  if (!rect) {
    const n = r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentElement;
    rect = n.getBoundingClientRect();
  }
  const view = $('#view');
  const vr = view.getBoundingClientRect();
  const delta = rect.top - (vr.top + vr.height * 0.42);
  if (Math.abs(delta) > 6) view.scrollTop += delta;
}

let curPara = null;
document.addEventListener('selectionchange', () => {
  const sel = getSelection();
  let n = sel.anchorNode, p = null;
  while (n && n !== document.body) {
    if (n.nodeType === 1 && n.tagName === 'P' && n.parentElement?.classList.contains('prose')) { p = n; break; }
    n = n.parentNode;
  }
  if (p !== curPara) {
    curPara?.classList.remove('current');
    p?.classList.add('current');
    curPara = p;
  }
});

 * Inspector

  const ins = $('#inspector');

  const { kind, id } = ui.sel;

  } else if (kind === 'chapter') {
    const ch = chapterOf(id);

  } else ins.replaceChildren(inspectBook());
}

function chipToggles(items, selected, onToggle, emptyText, onAdd) {
  const box = h('div', { class: 'chips' });
  for (const e of items) {
    box.append(h('button', { class: `chip${selected.includes(e.id) ? ' on' : ''}`, onclick: () => onToggle(e.id) },
      h('span', { class: 'swatch', style: { background: e.color } }), e.name || 'Unnamed'));

  if (index == null) index = ui.sel.kind === 'scene' && ch === locateScene(ui.sel.id)?.ch ? locateScene(ui.sel.id).index + 1 : ch.children.length;

  if (i < 0) return;
  checkpoint('Move chapter');
  const [ch] = project.manuscript.splice(i, 1);
  if (i < index) index--;
  project.manuscript.splice(clamp(index, 0, project.manuscript.length), 0, ch);
  touch();
  renderAll();
}
function addEntity(kind) {
  flushEditors();
  const e = mkEntity(kind);
  project[kind].push(e);
  ui.view = kind;
  ui.entitySel[kind] = e.id;
  touch();
  renderAll();
  setTimeout(focusTitle, 30);
}
async function deleteEntity(kind, e) {
  if (!(await confirmBox(`Delete ${e.name || `this ${ENTITY[kind].one}`}? Scenes stay, but they lose the tag.`))) return;
  checkpoint(`Delete ${e.name || ENTITY[kind].one}`);
  project[kind] = project[kind].filter((x) => x !== e);
  for (const s of scenes()) {
    if (kind === 'characters') { s.characters = s.characters.filter((id) => id !== e.id); if (s.pov === e.id) s.pov = ''; } else if (s.location === e.id) s.location = '';
  }
  ui.entitySel[kind] = null;
  touch();
  renderAll();
}
function addThread() {

  touch();

  setTimeout(() => { const el = $(`#thread-${t.id} input`); if (el) { el.scrollIntoView({ block: 'center' }); el.focus(); el.select(); } }, 30);
}
async function deleteThread(t) {

  checkpoint(`Delete “${t.name}”`);
  project.threads = project.threads.filter((x) => x !== t);
  for (const s of scenes()) s.threads = s.threads.filter((id) => id !== t.id);

}
function addNote() {

/** Create a character, place or thread by name and tag it on the scene, without leaving the page. */
async function quickAdd(kind, s) {
  const label = kind === 'threads' ? 'plot thread' : ENTITY[kind].one;
  const name = await promptBox(`New ${label}`, kind === 'threads' ? 'e.g. The missing log book' : 'Name');
  if (!name) return;
  if (kind === 'threads') {
    const t = mkThread(name);
    project.threads.push(t);
    s.threads.push(t.id);
  } else {
    const e = mkEntity(kind, name);
    project[kind].push(e);
    if (kind === 'characters') s.characters.push(e.id); else s.location = e.id;
  }
  touch();
  renderInspector();
  toast(`Added ${name}. Fill in the details under ${kind === 'threads' ? 'Story map' : ENTITY[kind].title}.`);
}

/* ---------- undo and redo for structure (text undo is the browser's own Ctrl+Z) ---------- */
const undoStack = [], redoStack = [];
function checkpoint(label) {
  flushEditors();
  undoStack.push({ label, data: serialize(), sel: { ...ui.sel } });
  if (undoStack.length > 60) undoStack.shift();
  redoStack.length = 0;
}
function restoreState(c) {
  replaceProject(c.data);
  ui.sel = c.sel;
  validateSel();
  touch();
  renderAll();
}
function undo() {
  const c = undoStack.pop();
  if (!c) { toast('Nothing to undo'); return; }
  flushEditors();
  redoStack.push({ label: c.label, data: serialize(), sel: { ...ui.sel } });
  restoreState(c);
  toast(`Undone: ${c.label}`, { label: 'Redo', run: redo });
}
function redo() {
  const c = redoStack.pop();
  if (!c) { toast('Nothing to redo'); return; }
  flushEditors();
  undoStack.push({ label: c.label, data: serialize(), sel: { ...ui.sel } });
  restoreState(c);
  toast(`Redone: ${c.label}`);
}
/** Swap in a whole new copy of the story (undo, sync, merge). Caller has flushed editors. */
function replaceProject(data) {
  pending.clear();
  editors.clear();
  project = normalize(typeof data === 'string' ? JSON.parse(data) : data);
}
function validateSel() {
  const { kind, id } = ui.sel;
  if ((kind === 'scene' && !locateScene(id)) || (kind === 'chapter' && !chapterOf(id))) ui.sel = { kind: 'book', id: null };
  for (const k of ['characters', 'locations']) if (ui.entitySel[k] && !byId(project[k], ui.entitySel[k])) ui.entitySel[k] = null;
  if (ui.noteSel && !byId(project.notes, ui.noteSel)) ui.noteSel = project.notes[0]?.id || null;
}

/** Remember where the caret is (scene id + character offset), so a re-render can put it back. */
function saveCaret() {
  const el = document.activeElement;
  if (!el || !el.classList?.contains('prose')) return null;
  const sel = getSelection();
  if (!sel.rangeCount) return null;
  const r = document.createRange();
  r.selectNodeContents(el);
  r.setEnd(sel.getRangeAt(0).startContainer, sel.getRangeAt(0).startOffset);
  return { id: el.dataset.id, offset: r.toString().length, scroll: $('#view').scrollTop };
}
function restoreCaret(c) {
  if (!c) return;
  const el = $(`#view .prose[data-id="${c.id}"]`);
  if (!el) return;
  $('#view').scrollTop = c.scroll;
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  let left = c.offset, n;
  while ((n = walker.nextNode())) {
    if (left <= n.data.length) {
      el.focus({ preventScroll: true });
      const r = document.createRange();
      r.setStart(n, left); r.collapse(true);
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      return;
    }
    left -= n.data.length;
  }
  el.focus({ preventScroll: true });
}

/** Put a merge result in place, keeping the writer where they were. */
function applyMerged(m, why) {
  const caret = saveCaret();
  const sel = { ...ui.sel };
  replaceProject(m.project);
  ui.sel = sel;
  validateSel();
  touch();
  renderAll();
  restoreCaret(caret);
  if (m.copies) toast(`${why}. ${plural(m.copies, 'scene')} had been changed in both places, so both versions are kept, marked “(other version)”.`);
  else if (m.conflicts.length) toast(`${why}. Merged; where both copies changed the same note, both texts are kept.`);
  else toast(`${why}. Merged.`);
}

/* ---------- split and merge scenes ---------- */
const trimEmpty = (html) => html.replace(/^(<p><br><\/p>)+/, '').replace(/(<p><br><\/p>)+$/, '') || '<p><br></p>';
function caretEditor() {
  const sel = getSelection();
  if (!sel.rangeCount) return null;
  let n = sel.anchorNode;
  while (n && !(n.nodeType === 1 && n.classList.contains('prose'))) n = n.parentNode;
  return n;
}
function splitScene() {
  const el = caretEditor();
  const s = el && editors.get(el);
  if (!s || !locateScene(s.id)) { toast('Click in a scene where the new scene should begin, then split.'); return; }
  checkpoint('Split scene');
  const r = getSelection().getRangeAt(0).cloneRange();
  r.collapse(true);
  r.setEnd(el, el.childNodes.length);
  const box = document.createElement('div');
  box.append(r.extractContents());
  s.content = trimEmpty(sanitizeHTML(el.innerHTML));
  s._wc = null;
  const l = locateScene(s.id);
  const next = {
    ...mkScene(`${s.title || 'Untitled scene'} (continued)`), status: s.status, pov: s.pov, characters: [...s.characters],
    location: s.location, threads: [...s.threads], when: s.when, content: trimEmpty(sanitizeHTML(box.innerHTML)),
  };
  l.ch.children.splice(l.index + 1, 0, next);
  touch();
  select('scene', next.id);
  setTimeout(focusTitle, 30);
  toast('Scene split in two', { label: 'Undo', run: undo });
}
function mergeWithNext(s) {
  const l = locateScene(s.id);
  const next = l && l.ch.children[l.index + 1];
  if (!next) return;
  checkpoint('Merge scenes');
  s.content = trimEmpty(trimEmpty(s.content) + trimEmpty(next.content));
  s._wc = null;
  for (const k of ['characters', 'threads']) for (const id of next[k]) if (!s[k].includes(id)) s[k].push(id);
  for (const k of ['synopsis', 'notes']) if (next[k]) s[k] = s[k] ? `${s[k]}\n${next[k]}` : next[k];
  l.ch.children.splice(l.index + 1, 1);
  touch();
  select('scene', s.id);
  toast(`Merged “${next.title || 'Untitled scene'}” into this scene`, { label: 'Undo', run: undo });
}

/* ---------- find and replace ---------- */
function openReplace() {
  if (!project) return;
  flushEditors();
  const find = h('input', { class: 'field', placeholder: 'Find', spellcheck: 'false' });
  const repl = h('input', { class: 'field', placeholder: 'Replace with', spellcheck: 'false' });
  const opts = { cs: false, ww: false };
  const box = (key, label) => h('label', { class: 'chk' }, h('input', { type: 'checkbox', onchange: (e) => { opts[key] = e.target.checked; update(); } }), label);
  const info = h('div', { class: 'hint' });
  const list = h('div', { class: 'appear fr-list' });
  const regex = () => {
    if (!find.value) return null;
    let src = escRe(find.value);
    if (opts.ww) src = `(?<![\\p{L}\\p{N}])${src}(?![\\p{L}\\p{N}])`;
    return new RegExp(src, opts.cs ? 'gu' : 'giu');
  };
  const update = debounce(() => {
    const re = regex();
    list.replaceChildren();
    if (!re) { info.textContent = 'Searches every scene in the manuscript.'; return; }
    let total = 0;
    for (const ch of project.manuscript) {
      for (const sc of ch.children) {
        const n = (plainOf(sc).match(re) || []).length;
        if (!n) continue;
        total += n;
        list.append(h('button', { onclick: () => { m.close(); select('scene', sc.id); setTimeout(() => findInView(find.value), 60); } },
          h('span', { class: `dot st-${sc.status}` }), h('span', {}, sc.title || 'Untitled scene'), h('span', { class: 'muted' }, ch.title), h('span', { class: 'how' }, plural(n, 'match', 'matches'))));
      }
    }
    info.textContent = total ? `${plural(total, 'match', 'matches')} in ${plural(list.children.length, 'scene')}` : 'No matches';
  }, 120);
  find.addEventListener('input', update);
  const m = modal({
    title: 'Find and replace', wide: true,
    body: h('div', { class: 'fr' }, find, repl, h('div', { class: 'fr-opts' }, box('cs', 'Match case'), box('ww', 'Whole words')), info, list),
    actions: [{ label: 'Close' }, { label: 'Replace all', primary: true, run: () => {
      const re = regex();
      if (!re) return false;
      const n = replaceAll(re, repl.value);
      if (!n) { toast('No matches to replace'); return false; }
      toast(`Replaced ${plural(n, 'match', 'matches')}`, { label: 'Undo', run: undo });
      return true;
    } }],
  });
  update();
}
function replaceAll(re, replacement) {
  checkpoint('Replace all');
  let total = 0;
  for (const sc of scenes()) {
    const frag = parseFragment(sc.content);
    const walker = document.createTreeWalker(frag, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    let n = 0;
    for (const t of nodes) {
      const before = n;
      const v = t.data.replace(re, () => { n++; return replacement; });
      if (n !== before) t.data = v;
    }
    if (n) {
      const div = document.createElement('div');
      div.append(frag);
      sc.content = sanitizeHTML(div.innerHTML);
      sc._wc = null;
      total += n;
    }
  }
  if (total) { touch(); renderAll(); } else undoStack.pop();
  return total;
}

/* ---------- import and export ---------- */
function pickFile(accept) {
  return new Promise((res) => {
    const input = h('input', { type: 'file', accept, style: { display: 'none' } });
    input.addEventListener('change', () => { res(input.files[0] || null); input.remove(); });
    input.addEventListener('cancel', () => { res(null); input.remove(); });
    document.body.append(input);
    input.click();
  });
}
const DOC_TYPES = '.docx,.md,.markdown,.txt,.text';
async function parseDocument(file) {
  const name = file.name.replace(/\.[^.]+$/, '');
  if (/\.docx$/i.test(file.name)) return QuireDocs.importDocx(new Uint8Array(await file.arrayBuffer()), name);
  if (/\.(md|markdown|txt|text)$/i.test(file.name)) return QuireDocs.importText(await file.text(), name, /\.(md|markdown)$/i.test(file.name));
  throw new Error('Quire can import Word (.docx), Markdown (.md) and text (.txt) files.');
}
function chaptersFrom(parsed) {
  return parsed.chapters.map((c) => ({
    ...mkChapter(c.title || 'Untitled chapter'),
    children: c.scenes.map((sc) => ({ ...mkScene(sc.title || ''), content: sanitizeHTML(sc.html || '') })),
  }));
}
async function importIntoStory(file) {
  file = file || await pickFile(DOC_TYPES);
  if (!file) return;
  try {
    const chs = chaptersFrom(await parseDocument(file));
    if (!chs.length) { toast('Found nothing to import in that file.'); return; }
    checkpoint(`Import ${file.name}`);
    project.manuscript.push(...chs);
    touch();
    select('chapter', chs[0].id);
    const n = chs.reduce((a, c) => a + c.children.length, 0);
    toast(`Imported ${plural(chs.length, 'chapter')} and ${plural(n, 'scene')}`, { label: 'Undo', run: undo });
  } catch (e) { console.error(e); toast(`Couldn’t import: ${e.message}`); }
}
async function newFromDraft() {
  const file = await pickFile(DOC_TYPES);
  if (!file) return;
  try {
    const parsed = await parseDocument(file);
    const p = newProject(parsed.title || file.name.replace(/\.[^.]+$/, ''));
    const chs = chaptersFrom(parsed);
    if (chs.length) p.manuscript = chs;
    await openProject(p, null, { recoverCheck: false });
    toast(`Imported ${plural(totalWC(), 'word')}. ${HAS_FS ? 'Choose where to save it.' : ''}`);
    if (HAS_FS) saveAs();
  } catch (e) { console.error(e); toast(`Couldn’t import: ${e.message}`); }
}
function exportDocx() {
  flushEditors();
  const bytes = QuireDocs.exportDocx(project, { countWords: totalWC });
  download(`${safeName(project.meta.title)}.docx`, new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' }));
  toast('Exported a Word manuscript');
}
